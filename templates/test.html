<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Help Page</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <!-- Example Card -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"  style="background-color: black; color: yellow;">
                        Easy Play
                    </div>
                    <div class="card-body" style="background-color: gold; color: black;">
                        <h5 class="card-title">Achieve Monetary Amount</h5>
                        <p class="card-text">The Monetary goal or target is $100,000,000 cash on hand with no loans.</p>
                        <p class="card-text"><small class="text-muted">Goal Code: AMA</small></p>
                    </div>
                </div>
            </div>
            <!-- Add more cards here for each level and goal -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
