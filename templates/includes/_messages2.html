{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} p-0">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

{% if error %}
<div class="alert alert-warning p-0" style="background-color: pink;">{{error}}</div>
{% endif %}

{% if msg %}
<div class="alert alert-success p-0">{{msg}}</div>
{% endif %}
